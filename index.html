// pinch: passa da solo tra "pagina intera" e "larghezza"
async function switchFit(mode, focusY) {
  const H = stage.clientHeight;
  const frac = focusY != null ? ((underCv.sy || 0) + focusY) / (underCv.cssH || H) : 0;
  S.fit = mode; saveSettings(); quickLabels();
  Z.s = 1; Z.x = 0; Z.y = 0; applyZoom(false);
  await show(underCv, R.vi, 1, 'top');
  if (mode === 'width' && focusY != null) setScroll(underCv, frac * underCv.cssH - focusY);
  try { underCv.animate([{ opacity: .35 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' }); } catch {}
  modeTag(mode === 'width' ? 'Adatta alla larghezza' : 'Pagina intera');
  prefetch();
}

/* ================= GitHub: libreria nel repository privato ================= */
const VOL_RE = /\.(pdf|cbz|zip)$/i;
const b64enc = str => btoa(unescape(encodeURIComponent(str)));
const b64dec = b => decodeURIComponent(escape(atob(b.replace(/\s/g, ''))));
const remoteId = p => 'gh_' + Array.from(p).reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36) + '_' + p.length;

const GH = {
  cfg: null, remote: [], prog: {}, branch: null, busy: false, pushT: null, pushing: null,
  load() {
    try { this.cfg = JSON.parse(localStorage.getItem('manga-gh') || 'null'); } catch { this.cfg = null; }
    try { this.remote = JSON.parse(localStorage.getItem('manga-gh-remote') || '[]'); } catch { this.remote = []; }
    try { this.prog = JSON.parse(localStorage.getItem('manga-gh-prog') || '{}'); } catch { this.prog = {}; }
    if (!this.cfg) { this.remote = []; this.prog = {}; }
  },
  save() { try { localStorage.setItem('manga-gh', JSON.stringify(this.cfg)); } catch {} },
  async api(path, opts = {}) {
    const { owner, repo, token } = this.cfg;
    const url = path.startsWith('http') ? path : `https://api.github.com/repos/${owner}/${repo}${path}`;
    const r = await fetch(url, { ...opts, cache: 'no-store', headers: {
      Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', ...(opts.headers || {}) } });
    return r;
  },
  async listRemote() {
    if (!this.branch) {
      const r = await this.api('');
      if (r.status === 401) throw new Error('token');
      if (r.status === 404) throw new Error('repo');
      if (!r.ok) throw new Error('net');
      this.branch = (await r.json()).default_branch || 'main';
    }
    const r = await this.api(`/git/trees/${encodeURIComponent(this.branch)}?recursive=1`);
    if (r.status === 409 || r.status === 404) return []; // repository vuoto
    if (!r.ok) throw new Error('net');
    const tree = (await r.json()).tree || [];
    const vols = [], folders = new Map();
    for (const t of tree) {
      if (t.type !== 'blob' || /(^|\/)\./.test(t.path)) continue;
      const name = t.path.split('/').pop();
      if (VOL_RE.test(name)) {
        vols.push({ path: t.path, sha: t.sha, size: t.size, title: cleanTitle(name), type: /\.pdf$/i.test(name) ? 'pdf' : 'zip' });
      } else if (IMG_RE.test(name) && t.path.includes('/')) {
        const dir = t.path.slice(0, t.path.lastIndexOf('/'));
        if (!folders.has(dir)) folders.set(dir, []);
        folders.get(dir).push({ path: t.path, sha: t.sha, size: t.size });
      }
    }
    for (const [dir, files] of folders) {
      files.sort((a, b) => natural(a.path, b.path));
      vols.push({ path: dir + '/', title: cleanTitle(dir.split('/').pop()), type: 'folder', files,
        size: files.reduce((s, f) => s + f.size, 0), sha: files.map(f => f.sha).join('').slice(0, 40) });
    }
    return vols;
  },
  async getProgress() {
    const r = await this.api('/contents/progress.json');
    if (r.status === 404) return { data: {}, sha: null };
    if (!r.ok) throw new Error('net');
    const j = await r.json();
    let data = {};
    try { data = JSON.parse(b64dec(j.content)); } catch {}
    return { data, sha: j.sha };
  },
  // unisce i segnalibri: vince quello letto più di recente
  async syncProgress() {
    for (let attempt = 0; attempt < 2; attempt++) {
      const { data, sha } = await this.getProgress();
      const local = (await DB.all()).filter(b => b.path);
      let changedRemote = false, changedLocal = false;
      for (const b of local) {
        const rp = data[b.path];
        if (rp && rp.updated > (b.lastRead || 0)) {
          b.page = rp.page; b.lastRead = rp.updated; b.read = !!rp.read; if (!b.pages && rp.pages) b.pages = rp.pages;
          await DB.put(b); changedLocal = true;
          if (R.book && R.book.id === b.id) { R.book.page = b.page; R.book.lastRead = b.lastRead; R.book.read = b.read; }
        } else if (b.lastRead && (!rp || rp.updated < b.lastRead)) {
          data[b.path] = { page: b.page, pages: b.pages, read: !!b.read, updated: b.lastRead }; changedRemote = true;
        }
      }
      this.prog = data;
      try { localStorage.setItem('manga-gh-prog', JSON.stringify(data)); } catch {}
      if (!changedRemote) return changedLocal;
      const body = JSON.stringify({ message: 'Aggiorna segnalibri', content: b64enc(JSON.stringify(data, null, 1)), ...(sha ? { sha } : {}) });
      const w = await this.api('/contents/progress.json', { method: 'PUT', body, headers: { 'Content-Type': 'application/json' } });
      if (w.ok) return changedLocal;
      if (w.status !== 409 && w.status !== 422) throw new Error('write');
    }
    return false;
  },
  pushSoon(ms) {
    if (!this.cfg) return;
    clearTimeout(this.pushT);
    this.pushT = setTimeout(() => {
      this.pushing = (this.pushing || Promise.resolve()).then(() => this.syncProgress()).catch(e => console.warn('sync', e));
    }, ms);
  },
  async sync(quiet) {
    if (!this.cfg || this.busy) return;
    this.busy = true; ghButton();
    try {
      this.remote = await this.listRemote();
      try { localStorage.setItem('manga-gh-remote', JSON.stringify(this.remote)); } catch {}
      await this.syncProgress();
      this.err = null; this.lastSync = Date.now();
    } catch (e) {
      console.warn(e);
      this.err = e.message;
      if (!quiet) toast(e.message === 'token' ? 'Token non valido o scaduto' : e.message === 'repo' ? 'Repository non trovato' : 'GitHub non raggiungibile');
    }
    this.busy = false; ghButton();
    if (!R.pdf) renderLibrary();
  },
  async download(item, onProg) {
    const raw = { Accept: 'application/vnd.github.raw+json' };
    const fetchBlob = async (sha, size, base, total) => {
      const r = await this.api(`/git/blobs/${sha}`, { headers: raw });
      if (!r.ok) throw new Error('download');
      if (!r.body || !r.body.getReader) { const b = await r.blob(); onProg(base + b.size, total); return b; }
      const rd = r.body.getReader(), parts = []; let got = 0;
      for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; onProg(base + got, total); }
      return new Blob(parts);
    };
    if (item.type !== 'folder') return [await fetchBlob(item.sha, item.size, 0, item.size)];
    const out = []; let base = 0;
    for (const f of item.files) { out.push(await fetchBlob(f.sha, f.size, base, item.size)); base += f.size; }
    return out;
  }
};

function ghButton() {
  $('#menuBtn').classList.toggle('err', !!(GH.cfg && GH.err));
  const t = GH.lastSync ? new Date(GH.lastSync).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '';
  $('#syncInfo').textContent = !GH.cfg ? '' : GH.busy ? 'Aggiornamento in corso…' : GH.err ? 'Sincronizzazione non riuscita · tira giù per riprovare' : t ? `Aggiornato alle ${t} · tira giù per aggiornare` : '';
}

  const btn = (a, icon, label, extra = '', cls = '') => `<button data-m="${a}" class="${cls}">${I[icon]}<span>${label}</span>${extra}</button>`;
  $('#dropdown').innerHTML =
    (c ? `<div class="dinfo">GitHub: <b style="color:var(--text)">${esc(c.owner)}/${esc(c.repo)}</b></div>` + btn('sync', 'sync', 'Aggiorna libreria')
       : btn('connect', 'gh', 'Collega GitHub')) +
    '<hr>' + btn('newcoll', 'add', 'Nuova collezione') +
    btn('reading', 'read', 'Impostazioni di lettura e tema') +
    btn('add', 'add', 'Aggiungi file dal telefono') +
    (c ? '<hr>' + btn('autofree', 'auto', 'Togli dal telefono i volumi finiti', `<span class="tog ${S.autoFree !== 'off' ? 'on' : ''}"></span>`) +
      btn('freeRead', 'free', 'Libera spazio: volumi letti') +
      btn('freeAll', 'free', 'Libera spazio: tutti i volumi GitHub') +
      '<hr>' + btn('edit', 'gh', 'Modifica collegamento GitHub') + btn('disconnect', 'off', 'Scollega GitHub', '', 'danger') : '');
  $('#dropdown').classList.add('on'); $('#ddScrim').classList.add('on');
}
function closeMenu() { $('#dropdown').classList.remove('on'); $('#ddScrim').classList.remove('on'); }
$('#menuBtn').onclick = () => $('#dropdown').classList.contains('on') ? closeMenu() : openMenu();
$('#ddScrim').onclick = closeMenu;
$('#dropdown').onclick = e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  const a = b.dataset.m;
  if (a === 'autofree') {
    S.autoFree = S.autoFree === 'off' ? 'on' : 'off'; saveSettings();
    b.querySelector('.tog').classList.toggle('on', S.autoFree !== 'off');
    return;
  }
  closeMenu();
  if (a === 'sync') refreshLibrary();
  if (a === 'connect' || a === 'edit') ghSetup();
  if (a === 'reading') readingSettings();
  if (a === 'newcoll') newColl();
  if (a === 'add') $('#fileIn').click();
  if (a === 'freeRead') freeSpace(i => i.read);
  if (a === 'freeAll') freeSpace(() => true);
  if (a === 'disconnect') {
    GH.cfg = null; GH.remote = []; GH.branch = null; GH.prog = {}; GH.err = null;
    try { localStorage.removeItem('manga-gh'); localStorage.removeItem('manga-gh-remote'); localStorage.removeItem('manga-gh-prog'); } catch {}
    ghButton(); renderLibrary(); toast('GitHub scollegato');
  }
};

async function refreshLibrary() {
  if (!GH.cfg) { await renderLibrary(); toast('Collega GitHub dal menu ☰ per sincronizzare'); return; }
  await GH.sync(false);
  if (!GH.err) toast('Libreria aggiornata');
}

/* ---------- tira giù per aggiornare ---------- */
(() => {
  const ptr = $('#ptr'); let pt = null;
  const set = (d, anim) => {
    ptr.style.transition = anim ? 'transform .25s ease' : 'none';
    ptr.style.transform = `translateY(${d - 80}px) rotate(${Math.round(d * 3)}deg)`;
  };
  const blocked = () => $('#reader').classList.contains('on') || $('#sheet').classList.contains('on') ||
    $('#dropdown').classList.contains('on') || $('#loader').classList.contains('on');
  window.addEventListener('touchstart', e => {
    if (blocked() || window.scrollY > 0 || e.touches.length > 1 || GH.busy) return;
    pt = { y: e.touches[0].clientY, d: 0 };
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!pt) return;
    const dy = e.touches[0].clientY - pt.y;
    if (dy <= 0 || window.scrollY > 0) { if (pt.d) set(0); pt.d = 0; return; }
    e.preventDefault();
    pt.d = Math.min(120, dy * 0.5);
    set(pt.d);
    ptr.classList.toggle('go', pt.d >= 70);
  }, { passive: false });
  const end = async () => {
    if (!pt) return;
    const d = pt.d; pt = null;
    if (d >= 70) {
      set(84, true); ptr.classList.add('spin');
      try { await refreshLibrary(); } catch {}
      ptr.classList.remove('spin');
    }
    ptr.classList.remove('go');
    set(0, true);
  };
  window.addEventListener('touchend', end);
  window.addEventListener('touchcancel', end);
})();

function ghSetup() {
  const c = GH.cfg || { owner: 'MedioGrave', repo: 'manga-library', token: '' };
  openSheet(`<h3>Collega GitHub</h3>
    <p class="note">Repository privato con i tuoi volumi e token personale con accesso a quel repository (permesso <code>Contents</code>: lettura e scrittura).</p>
    <div class="opt"><label>REPOSITORY</label><input id="ghRepo" class="field" style="margin:0" value="${esc(c.owner + '/' + c.repo)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="opt"><label>TOKEN</label><textarea id="ghTok" class="field" style="margin:0;height:84px;resize:none;font-family:ui-monospace,Menlo,monospace;font-size:13px" placeholder="Incolla qui il token: github_pat_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true">${esc(c.token)}</textarea>
    <div id="ghTokInfo" class="note" style="margin:8px 0 0"></div></div>
    <div class="row2"><button class="btn2" data-x>Annulla</button><button class="btn1" data-ok>Collega</button></div>`);
  $('#sheet [data-x]').onclick = closeSheet;
  const tokInfo = () => {
    const t = $('#ghTok').value.replace(/\s+/g, '');
    $('#ghTokInfo').textContent = !t ? '' : /^(github_pat_|ghp_)/.test(t)
      ? `${t.length} caratteri · inizia con ${t.slice(0, 11)}… finisce con …${t.slice(-4)}`
      : 'Attenzione: un token GitHub inizia con github_pat_ (o ghp_)';
  };
  $('#ghTok').oninput = tokInfo; tokInfo();
  $('#sheet [data-ok]').onclick = async () => {
    const [owner, repo] = $('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '').split('/');
    const token = $('#ghTok').value.replace(/\s+/g, '');
    if (!owner || !repo || !token) return toast('Compila repository e token');
    closeSheet();
    const prev = GH.cfg;
    GH.cfg = { owner, repo, token }; GH.branch = null;
    loading('Controllo il collegamento…');
    try {
      await GH.listRemote();
      GH.save(); loading('');
      toast('GitHub collegato');
      GH.sync(true);
    } catch (e) {
      loading(''); GH.cfg = prev; GH.branch = null; ghButton();
      toast(e.message === 'token' ? 'Token non valido' : e.message === 'repo' ? 'Repository non trovato: controlla nome e permessi del token' : 'GitHub non raggiungibile');
    }
  };
}

async function downloadRemote(path, open = true) {
  const item = GH.remote.find(r => r.path === path);
  if (!item || !GH.cfg) return;
  loading(`Scarico ${item.title}…`);
  try {
    const blobs = await GH.download(item, (got, tot) => {
      $('#loadtxt').textContent = `Scarico ${item.title}… ${tot ? Math.min(100, Math.round(got / tot * 100)) : ''}%`;
    });
    $('#loadtxt').textContent = `Preparo ${item.title}…`;
    const id = remoteId(item.path);
    const prev = await DB.get(id);
    const extra = { path: item.path, sha: item.sha, offloaded: false,
      ...(prev ? { page: prev.page || 0, lastRead: prev.lastRead || 0, read: !!prev.read, crops: prev.crops, added: prev.added || Date.now(), ...('series' in prev ? { series: prev.series } : {}) } : {}) };
    let book;
    if (item.type === 'pdf') {
      const buf = await blobs[0].arrayBuffer();
      const blob = new Blob([buf], { type: 'application/pdf' });
      const doc = await openPdfDoc(buf);
      book = await saveVolume({ title: item.title, kind: 'pdf', data: blob, doc, size: item.size, id, extra });
      await doc.destroy();
    } else if (item.type === 'zip') {
      const entries = unzipSync(new Uint8Array(await blobs[0].arrayBuffer()), { filter: e => IMG_RE.test(e.name) && !/(^|\/)(__MACOSX|\.)/.test(e.name) });
      const names = Object.keys(entries).sort(natural);
      if (!names.length) throw new Error('nessuna immagine nello zip');
      const pages = names.map(n => new Blob([entries[n]], { type: mimeOf(n) }));
      book = await saveVolume({ title: item.title, kind: 'images', data: { pages }, doc: imageDoc(pages), size: item.size, id, extra });
    } else {
      const pages = blobs.map((b, i) => new Blob([b], { type: mimeOf(item.files[i].path) }));
      book = await saveVolume({ title: item.title, kind: 'images', data: { pages }, doc: imageDoc(pages), size: item.size, id, extra });
    }
    loading('');
    try { await GH.syncProgress(); } catch {}
    if (open) await openBook(book.id);
    else { toast('Scaricato sul telefono'); renderLibrary(); }
  } catch (e) {
    console.error(e); loading('');
    toast('Download non riuscito: controlla la connessione');
    leaveBrokenReader();
  }
}

/* ================= avvio ================= */
(async () => {
  try {
    await DB.open();
    navigator.storage?.persist?.().catch(() => {});
    GH.load(); ghButton();
    await groupExisting();
    await renderLibrary();
    GH.sync(true);
  } catch (e) {
    $('#shelf').innerHTML = `<div class="empty"><h2>Archivio non disponibile</h2><p>Il browser non permette di salvare i file qui. Apri l'app da Safari o Chrome.</p></div>`;
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

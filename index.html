<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EFE5D6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manga">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Manga</title>
<style>
:root{
  --bg:#0e0e10;--panel:#19191c;--panel2:#232327;--line:#2c2c31;
  --text:#f2f0eb;--muted:#8f8c86;--accent:#e5383b;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input[type=file]{display:none}

/* ---------- LIBRERIA ---------- */
#library{min-height:100%;padding:calc(var(--st) + 26px) 18px calc(var(--sb) + 110px)}
.libhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:24px}
.brand{font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:.95}
.brand b{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:8px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sechead .section{margin-bottom:12px}
.sortbtn{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--muted);padding:6px 10px;margin:0 -6px 6px 0;border-radius:8px}
.sortbtn b{color:var(--text);font-weight:650}
.sortbtn:active{background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
.section{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:22px 14px}
.book{position:relative;text-align:left;display:block;width:100%}
.cover{aspect-ratio:5/7;border-radius:5px;overflow:hidden;background:var(--panel);position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 22px rgba(0,0,0,.55);transition:transform .15s}
.book:active .cover{transform:scale(.97)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.65)}
.prog i{display:block;height:100%;background:var(--accent)}
.badge{position:absolute;left:6px;top:6px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;
  letter-spacing:.06em;padding:3px 6px;border-radius:3px}
.btitle{font-size:14px;font-weight:650;margin-top:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bmeta{font-size:12px;color:var(--muted);margin-top:3px}
.more{position:absolute;top:5px;right:5px;width:32px;height:32px;border-radius:50%;background:rgba(14,14,16,.7);
  display:grid;place-items:center;font-size:18px;line-height:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:44px 24px;text-align:center;color:var(--muted);margin-top:10px}
.empty h2{color:var(--text);font-size:19px;margin:14px 0 6px}
.empty p{margin:0;font-size:14px;line-height:1.5}
.fab{position:fixed;right:18px;bottom:calc(var(--sb) + 22px);background:var(--accent);color:#fff;border-radius:999px;
  padding:16px 22px 16px 18px;font-weight:750;font-size:15px;box-shadow:0 10px 28px rgba(229,56,59,.45);display:flex;gap:8px;align-items:center;z-index:5}
.fab svg{width:20px;height:20px}
.ghbtn{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 13px 9px 11px;font-size:13px;font-weight:650;color:var(--muted)}
.ghbtn svg{width:18px;height:18px}
.ghbtn.on{color:var(--text)}
.ghbtn.spin svg{animation:sp 1s linear infinite}
.ghcover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;
  background:repeating-linear-gradient(135deg,#1d1d21 0 10px,#19191c 10px 20px)}
.ghcover b{font-size:13px;line-height:1.25;font-weight:750;word-break:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ghcover span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:650}
.ghcover svg{width:16px;height:16px;flex:none}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:-4px 0 16px}
.note code{background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--text)}
.cont{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:14px;padding:12px;margin-bottom:28px;width:100%;text-align:left}
.cont .th{width:60px;aspect-ratio:5/7;border-radius:4px;overflow:hidden;background:var(--panel2);flex:none;display:grid;place-items:center;color:var(--muted)}
.cont .th img{width:100%;height:100%;object-fit:cover;display:block}
.cont .ci{flex:1;min-width:0}
.cont .k{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent)}
.cont .t{font-weight:700;font-size:16px;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .m{font-size:12px;color:var(--muted)}
.pbar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.cloudb{position:absolute;right:6px;bottom:10px;width:26px;height:26px;border-radius:50%;background:rgba(14,14,16,.78);display:grid;place-items:center;color:var(--text)}
.cloudb svg{width:15px;height:15px}
.readb{position:absolute;left:6px;top:6px;background:rgba(14,14,16,.85);color:#7ddc9a;font-size:10px;font-weight:800;padding:3px 6px;border-radius:3px;letter-spacing:.06em}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:750;line-height:1.25;
  background:repeating-linear-gradient(135deg,#1d1d21 0 10px,#19191c 10px 20px);word-break:break-word;text-align:left}
.stack .cover{box-shadow:5px -5px 0 -1px #2b2b30,10px -10px 0 -2px #202024,0 8px 22px rgba(0,0,0,.55)}
.stack{padding-top:10px;padding-right:10px}
.shead{display:flex;align-items:center;gap:4px;margin:-8px 0 14px -12px}
.stitle{font-size:24px;font-weight:850;letter-spacing:-.02em;line-height:1.1}
.sacts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:12.5px;font-weight:650;color:var(--text)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .th{width:50px;aspect-ratio:5/7;border-radius:4px;overflow:hidden;background:var(--panel);flex:none;position:relative;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.row .th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.row .ri{flex:1;min-width:0;text-align:left;display:block}
.row .rt{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.row .rm svg{width:14px;height:14px}
.row.read .rt{color:var(--muted)}
.row .pbar{margin-top:6px;height:3px}
.ok{color:#7ddc9a}
.row .more{position:static;background:transparent;flex:none;color:var(--muted)}
.menubtn{width:46px;height:46px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.menubtn svg{width:22px;height:22px}
.menubtn.err::after{content:"";position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
#syncInfo{font-size:12px;color:var(--muted);margin-top:3px;min-height:15px}
#dropdown{position:fixed;top:calc(var(--st) + 78px);right:14px;z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:290px;max-width:calc(100vw - 28px);padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.65);transform-origin:top right;
  transform:scale(.9) translateY(-6px);opacity:0;pointer-events:none;transition:transform .16s ease,opacity .16s ease}
#dropdown.on{transform:none;opacity:1;pointer-events:auto}
#dropdown button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 11px;border-radius:10px;font-size:15px;text-align:left}
#dropdown button:active{background:var(--panel2)}
#dropdown button svg{width:20px;height:20px;flex:none;color:var(--muted)}
#dropdown button.danger,#dropdown button.danger svg{color:var(--accent)}
#dropdown hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
#dropdown .dinfo{padding:9px 12px 5px;font-size:12px;color:var(--muted);line-height:1.4}
#dropdown .tog{margin-left:auto;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:.15s}
#dropdown .tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
#dropdown .tog.on{background:var(--accent)}
#dropdown .tog.on::after{left:19px}
#ddScrim{position:fixed;inset:0;z-index:44;display:none}
#ddScrim.on{display:block}
#ptr{position:fixed;top:calc(var(--st) + 12px);left:50%;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--panel2);
  display:grid;place-items:center;z-index:6;transform:translateY(-80px);box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none}
#ptr svg{width:22px;height:22px;transition:color .15s}
#ptr.go svg{color:var(--accent)}
#ptr.spin svg{animation:sp .8s linear infinite}
.qrow{display:flex;gap:8px;margin-bottom:14px}
.qb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 9px;border-radius:12px;background:var(--panel2);font-size:11.5px;font-weight:650;min-width:0}
.qb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qb svg{width:22px;height:22px}
.qb:active{background:var(--line)}
#modeTag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:16;pointer-events:none;background:rgba(14,14,16,.88);
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s,transform .2s}
#modeTag.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-height:500px){
  .top{padding-top:calc(var(--st) + 4px);padding-bottom:4px}
  .bottom{padding:8px 18px calc(var(--sb) + 8px)}
  .qrow{margin-bottom:6px}
  .qb{flex-direction:row;justify-content:center;padding:7px 8px;gap:7px;font-size:12px}
  .qb svg{width:18px;height:18px;flex:none}
  .pgrow{margin-bottom:2px}
}
.dropping #library{outline:3px dashed var(--accent);outline-offset:-10px}

/* ---------- LETTORE ---------- */
#reader{position:fixed;inset:0;background:#000;display:none;touch-action:none;z-index:10}
#reader.on{display:block}
#stage{position:absolute;inset:0;overflow:hidden}
#zoom{position:absolute;inset:0;transform-origin:0 0}
#zoom.anim{transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.layer{position:absolute;inset:0;overflow:hidden}
.layer canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#under{z-index:1}
#flipper{z-index:2;display:none;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0}
#flipper .shade{z-index:3}
#under .shade{z-index:2}

#ui{position:absolute;inset:0;pointer-events:none;z-index:20}
.bar{position:absolute;left:0;right:0;pointer-events:auto;transition:transform .25s ease,opacity .25s ease;
  background:rgba(14,14,16,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top{top:0;padding:calc(var(--st) + 8px) 8px 8px;display:flex;align-items:center;gap:6px}
.bottom{bottom:0;padding:14px 18px calc(var(--sb) + 16px)}
#reader:not(.ui) .top{transform:translateY(-100%);opacity:0;pointer-events:none}
#reader:not(.ui) .bottom{transform:translateY(100%);opacity:0;pointer-events:none}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ibtn:active{background:var(--panel2)}
.ibtn svg{width:24px;height:24px}
.rtitle{flex:1;min-width:0;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pgrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
.pgrow b{color:var(--text);font-weight:650}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);margin-top:-9px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--accent)}
.endcap{position:absolute;top:50%;transform:translateY(-50%);z-index:15;pointer-events:none;
  background:rgba(14,14,16,.85);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s}
.endcap.show{opacity:1}

/* hint primo avvio */
#hint{position:absolute;inset:0;z-index:30;display:none;grid-template-columns:1fr 1fr 1fr;background:rgba(0,0,0,.84)}
#hint.on{display:grid}
#hint div{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:14px;font-weight:650;line-height:1.35;border-right:1px dashed rgba(255,255,255,.25)}
#hint div:last-child{border-right:0}
#hint .go{color:#fff;background:rgba(229,56,59,.22)}
#hint small{display:block;font-weight:400;color:#c9c6bf;margin-top:6px;font-size:12px}

/* ---------- SHEET / LOADER ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:18px 18px 0 0;
  padding:10px 18px calc(var(--sb) + 22px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0 0 16px;font-size:17px}
.opt{margin-bottom:18px}
.opt label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.04em}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.menu button{display:flex;width:100%;padding:15px 4px;font-size:16px;border-bottom:1px solid var(--line);text-align:left}
.menu button:last-child{border-bottom:0}
.menu .danger{color:var(--accent)}
.field{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;padding:13px 14px;border-radius:10px;margin-bottom:16px;outline:none;-webkit-user-select:text;user-select:text}
.field:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2 button{flex:1;padding:14px;border-radius:12px;font-weight:700}
.btn1{background:var(--accent);color:#fff}
.btn2{background:var(--panel2)}
#loader{position:fixed;inset:0;z-index:60;background:rgba(14,14,16,.85);display:none;place-items:center;text-align:center;padding:30px}
#loader.on{display:grid}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
#loadtxt{font-size:14px;color:var(--muted);max-width:280px;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 100px);transform:translate(-50%,20px);background:var(--panel2);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:14px;z-index:70;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= TEMA: carta & inchiostro ================= */
@font-face{font-family:"Disp";src:url(fonts/josefin-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Disp";src:url(fonts/josefin-sans-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Body";src:url(fonts/poppins-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Body";src:url(fonts/poppins-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Body";src:url(fonts/poppins-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root,[data-theme=paper]{
  --bg:#EFE5D6;--panel:#F7F0E5;--panel2:#E5D7C3;--line:#D8C6AE;--text:#1E1A16;--muted:#7E7062;--accent:#E4432E;
  --ink:#1E1A16;--ok:#2E8350;--overlay:rgba(239,229,214,.94);--chip:#F7F0E5;--stripe1:#E7DAC7;--stripe2:#E0D1BB;
  --cshadow:3px 3px 0 var(--ink);--pshadow:0 14px 40px rgba(70,40,10,.22);
}
[data-theme=ink]{
  --bg:#13110F;--panel:#1D1A17;--panel2:#2A2521;--line:#38322B;--text:#F0E7DA;--muted:#9E9285;--accent:#EE573B;
  --ink:#000;--ok:#7BD69A;--overlay:rgba(19,17,15,.93);--chip:#1D1A17;--stripe1:#1E1B18;--stripe2:#191714;
  --cshadow:0 8px 20px rgba(0,0,0,.55);--pshadow:0 18px 50px rgba(0,0,0,.65);
}
html,body{font-family:"Body",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:background-color .25s}
h2,h3,.disp,.section,.btitle,.stitle,.rtitle,.cont .t,.fab,.btn1,.btn2{font-family:"Disp","Body",sans-serif}

/* intestazione */
.libhead{align-items:flex-start;margin-bottom:6px}
.logo{width:40px;height:56px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:700;font-size:19px;color:var(--accent);letter-spacing:.12em;line-height:1}
.hero{margin:22px 0 26px}
.kana{font-size:30px;font-weight:700;color:var(--accent);letter-spacing:.06em;line-height:1;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
.wave{display:block;width:62px;height:9px;margin:12px 0 14px;color:var(--ink)}
.htitle{font-family:"Disp";font-weight:700;font-size:31px;line-height:1.08;text-transform:uppercase;letter-spacing:.01em;margin:0}
.htitle em{font-style:normal;color:var(--accent);display:block}
.sub{font-size:12.5px;margin-top:12px}
#syncInfo{font-size:11.5px}
.menubtn{border-radius:4px;background:transparent;border:1.5px solid var(--ink);width:44px;height:44px}

/* sezioni */
.section{font-size:15px;font-weight:700;letter-spacing:.07em;color:var(--text);display:flex;align-items:center;gap:10px}
.section::before{content:"";width:18px;height:2.5px;background:var(--accent);display:block}
.sortbtn{font-size:12px}
.grid{gap:24px 16px}
.cover{border-radius:3px;box-shadow:var(--cshadow);background:var(--panel2)}
.cover::after{width:5%;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent)}
.btitle{font-size:15px;font-weight:700;margin-top:11px;letter-spacing:.01em}
.badge{border-radius:2px;font-family:"Disp";letter-spacing:.08em;padding:4px 6px 2px}
.readb{background:var(--panel);color:var(--ok);border-radius:2px;font-family:"Disp";padding:4px 6px 2px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.more{background:var(--panel);color:var(--text);border:1.5px solid var(--line);width:30px;height:30px;backdrop-filter:none;-webkit-backdrop-filter:none}
.cloudb{background:var(--panel);color:var(--text)}
.ph,.ghcover{background:repeating-linear-gradient(135deg,var(--stripe1) 0 10px,var(--stripe2) 10px 20px);color:var(--text);font-family:"Disp";text-transform:uppercase;letter-spacing:.02em}
.stack{padding-top:9px;padding-right:9px}
.stack .cover{box-shadow:4px -4px 0 -1.5px var(--panel2),4px -4px 0 0 var(--line),8px -8px 0 -1.5px var(--panel2),8px -8px 0 0 var(--line),var(--cshadow)}
.prog{background:rgba(0,0,0,.25)}
.fab{border-radius:3px;padding:15px 20px 13px 16px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;
  box-shadow:3px 3px 0 var(--ink)}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pill{border-radius:3px;border:1.5px solid var(--ink);background:transparent;font-weight:600}
.pill.red{background:var(--accent);border-color:var(--accent);color:#fff}
.cont{border-radius:4px;border:1.5px solid var(--ink);background:var(--panel);box-shadow:none}
.cont .k{font-family:"Disp";letter-spacing:.12em}
.row{border-bottom-color:var(--line)}
.row .th{border-radius:2px;box-shadow:2px 2px 0 var(--ink)}
.empty{border-radius:4px;border-color:var(--line)}
.ok{color:var(--ok)}
.sheet{border-radius:10px 10px 0 0;box-shadow:var(--pshadow)}
.sheet h3{font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.seg{border-radius:4px}
.seg button{border-radius:3px}
.btn1,.btn2{border-radius:3px!important;text-transform:uppercase;letter-spacing:.05em;padding:15px 14px 13px!important}
.btn1{box-shadow:2px 2px 0 var(--ink)}
.field{border-radius:4px}
#dropdown{border-radius:6px;box-shadow:var(--pshadow)}
#dropdown button{border-radius:4px}
#toast{border-radius:4px;background:var(--ink);color:var(--bg)}
[data-theme=ink] #toast{background:var(--panel2);color:var(--text)}
#loader{background:var(--overlay)}
.bar{background:var(--overlay)!important}
.qb{border-radius:4px;background:var(--panel);font-size:10.5px;padding-left:2px;padding-right:2px}
.qrow{gap:6px}
#modeTag,.endcap{background:var(--overlay)!important;color:var(--text);border-radius:4px}
#ptr{background:var(--panel);color:var(--text)}
.ctabs{display:flex;gap:22px;overflow-x:auto;margin:0 -18px 22px;padding:0 18px 4px;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex:none;font-size:13.5px;font-weight:500;color:var(--muted);padding:8px 0 6px;position:relative;white-space:nowrap}
.ctab.on{color:var(--accent);font-weight:600}
.ctab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.ctab.add{color:var(--text)}
.pick{display:flex;flex-direction:column;max-height:50vh;overflow:auto;margin:-4px 0 16px}
.pick label{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.pick input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.pick small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:5;opacity:0}
.reader-dismiss #stage{transition:transform .22s ease,opacity .22s ease}
</style>
</head>
<body>

<!-- LIBRERIA -->
<main id="library">
  <div class="libhead">
    <div>
      <div class="logo" aria-label="Manga">漫画</div>
    </div>
    <button class="menubtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="hero">
    <div class="kana">マンガ</div>
    <svg class="wave" viewBox="0 0 62 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 5c3.5-4 6.5-4 10 0s6.5 4 10 0 6.5-4 10 0 6.5 4 10 0 6.5-4 10 0 6.5 4 10 0"/></svg>
    <h1 class="htitle">La tua libreria<em id="htitle2">da sfogliare</em></h1>
    <div class="sub" id="libsub"></div>
    <div id="syncInfo"></div>
  </div>
  <div id="ctabs" class="ctabs"></div>
  <div id="continue"></div>
  <div id="shelf"></div>
</main>
<div id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg></div>
<div id="ddScrim"></div>
<div id="dropdown"></div>
<button class="fab" id="addBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Aggiungi
</button>
<input type="file" id="fileIn" accept="application/pdf,.pdf,.cbz,.zip,application/zip,application/x-cbz,image/*" multiple>

<!-- LETTORE -->
<section id="reader">
  <div id="stage">
    <div id="zoom">
      <div class="layer" id="under"><canvas id="underCv"></canvas><div class="shade" id="underShade"></div></div>
      <div class="layer" id="flipper"><canvas id="flipCv"></canvas><div class="shade" id="flipShade"></div></div>
    </div>
  </div>
  <div id="dim"></div>
  <div class="endcap" id="endcap"></div>
  <div id="modeTag"></div>
  <div id="ui">
    <div class="bar top">
      <button class="ibtn" id="backBtn" aria-label="Libreria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="rtitle" id="rtitle"></div>
      <button class="ibtn" id="setBtn" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="bar bottom">
      <div class="qrow">
        <button class="qb" data-q="fit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg><span id="qFit"></span></button>
        <button class="qb" data-q="mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg><span id="qMode"></span></button>
        <button class="qb" data-q="dir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12M7 7l3-3M7 7l3 3M17 17H5M17 17l-3-3M17 17l-3 3"/></svg><span id="qDir"></span></button>
        <button class="qb" data-q="tone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="qTone"></span></button>
        <button class="qb" data-q="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>Altro</span></button>
      </div>
      <div class="pgrow"><span id="pgL"></span><span id="pgR"></span></div>
      <input type="range" id="slider" min="0" max="0" value="0">
    </div>
  </div>
  <div id="hint"></div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="loader"><div><div class="spin"></div><div id="loadtxt"></div></div></div>
<div id="toast"></div>

<script type="module">
import * as pdfjsLib from './pdfjs/pdf.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('./pdfjs/pdf.worker.min.js', location.href).href;
import { unzipSync } from './fflate.js';

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= impostazioni ================= */
const DEF = { theme: 'paper', tone: 'normal', dim: 0, coll: '', dir: 'rtl', mode: 'auto', effect: 'flip', bg: 'black', fit: 'width', crop: 'on', autoFree: 'on', sort: 'name', chOrder: 'asc', hintSeen: false };
let S = { ...DEF };
try { S = { ...DEF, ...JSON.parse(localStorage.getItem('manga-settings') || '{}') }; } catch {}
function saveSettings() { try { localStorage.setItem('manga-settings', JSON.stringify(S)); } catch {} }
const mqDark = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const t = S.theme === 'auto' ? (mqDark && mqDark.matches ? 'ink' : 'paper') : S.theme;
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.content = t === 'ink' ? '#13110F' : '#EFE5D6';
}
applyTheme();
mqDark && mqDark.addEventListener && mqDark.addEventListener('change', applyTheme);

/* ================= database (IndexedDB) ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('manga-reader', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('books', { keyPath: 'id' });
        d.createObjectStore('files');
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      let out;
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  all() { return this.tx('books', 'readonly', s => s.getAll()); },
  get(id) { return this.tx('books', 'readonly', s => s.get(id)); },
  put(b) { return this.tx('books', 'readwrite', s => s.put(b)); },
  file(id) { return this.tx('files', 'readonly', s => s.get(id)); },
  putFile(id, blob) { return this.tx('files', 'readwrite', s => s.put(blob, id)); },
  async del(id) {
    await this.tx('books', 'readwrite', s => s.delete(id));
    await this.tx('files', 'readwrite', s => s.delete(id));
  }
};

/* ================= UI helper ================= */
function loading(txt) { $('#loadtxt').textContent = txt || ''; $('#loader').classList.toggle('on', !!txt); }
let toastT;
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtSize(b) { return b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b < 1e6 ? (b ? '<1 MB' : '0 MB') : Math.round(b / 1e6) + ' MB'; }

let sheetClose = null;
function openSheet(html, onClose) {
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#scrim').classList.add('on');
  requestAnimationFrame(() => $('#sheet').classList.add('on'));
  sheetClose = onClose || null;
}
function closeSheet() {
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  const f = sheetClose; sheetClose = null; f && f();
}
$('#scrim').onclick = closeSheet;

/* ================= libreria ================= */
const ICON_CLOUD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9a4 4 0 0 1 0 9z"/><path d="M12 11v6m-2.5-2.5L12 17l2.5-2.5"/></svg>';
let LIB = [], libSeries = null;
const seriesOf = p => { const parts = (p || '').replace(/\/$/, '').split('/'); return parts.length >= 2 ? parts[0] : null; };
// collezione di un volume: scelta a mano, altrimenti la cartella su GitHub
const collOf = b => ('series' in b) && (b.series !== undefined) && (b.series !== null || b.path) ? b.series : (b.path ? seriesOf(b.path) : null);

async function libraryItems() {
  const local = await DB.all();
  const known = new Set(local.map(b => b.path).filter(Boolean));
  const items = local.map(b => ({
    id: b.id, title: b.title, series: collOf(b), path: b.path || null, cover: b.cover, added: b.added || 0,
    pages: b.pages || 0, page: b.page || 0, read: !!b.read, lastRead: b.lastRead || 0, size: b.size || 0,
    state: b.offloaded ? 'cloud' : 'local', book: b }));
  for (const r of GH.remote) {
    if (known.has(r.path)) continue;
    const pr = GH.prog[r.path] || {};
    items.push({ id: remoteId(r.path), title: r.title, series: seriesOf(r.path), path: r.path, cover: null,
      pages: pr.pages || 0, page: pr.page || 0, read: !!pr.read, lastRead: pr.updated || 0, size: r.size, state: 'remote' });
  }
  return items;
}
const sortKey = i => i.path || ((i.series ? i.series + '/' : '') + i.title);
const SORTS = { name: 'Nome', recent: 'Letti di recente', added: 'Aggiunti di recente' };
const byName = (a, b) => natural(sortKey(a), sortKey(b));
function sortItems(list) {
  if (S.sort === 'recent') return list.sort((a, b) => (b.lastRead || 0) - (a.lastRead || 0) || byName(a, b));
  if (S.sort === 'added') return list.sort((a, b) => (b.added || 0) - (a.added || 0) || byName(a, b));
  return list.sort(byName);
}
// "Berserk 57", "Berserk Vol. 58", "Berserk_cap_59" -> "Berserk"
function guessSeries(title) {
  const t = title.replace(/[\s_\-.#]*(vol(ume)?|v|tomo|cap(itolo)?|ch(apter)?|c|n|numero|ep(isodio)?)?[\s_\-.#]*\d+([.,]\d+)?\s*(\(.*\)|\[.*\])?\s*$/i, '').trim();
  return t && t !== title && t.length >= 2 ? t : null;
}
function sortSheet() {
  openSheet(`<h3>Ordina la libreria</h3><div class="menu">${Object.entries(SORTS).map(([k, l]) =>
    `<button data-s="${k}">${l}${S.sort === k ? ' <span style="margin-left:auto;color:var(--accent)">✓</span>' : ''}</button>`).join('')}</div>`);
  $('#sheet').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.sort = b.dataset.s; saveSettings(); closeSheet(); renderLibrary(); });
}
const pct = i => i.read ? 100 : i.pages ? Math.round((i.page + 1) / i.pages * 100) : 0;
function statusOf(i) {
  if (i.read) return '<span class="ok">✓ Letto</span>';
  if (i.lastRead && i.pages) return `p. ${i.page + 1} di ${i.pages}`;
  if (i.state === 'remote') return `Da scaricare${i.size ? ' · ' + fmtSize(i.size) : ''}`;
  if (i.state === 'cloud') return 'Su GitHub · tocca per scaricare';
  return 'Da leggere';
}

async function renderLibrary() {
  LIB = await libraryItems();
  const onPhone = LIB.filter(i => i.state === 'local');
  const total = onPhone.reduce((s, i) => s + i.size, 0);
  $('#libsub').textContent = LIB.length
    ? `${onPhone.length} sul telefono · ${fmtSize(total)}${GH.cfg ? ` · ${LIB.length - onPhone.length} su GitHub` : ''}`
    : 'La tua libreria';
  if (libSeries) { renderTabs(null); return renderSeries(); }
  if (!LIB.length && !(S.colls || []).length) {
    $('#continue').innerHTML = ''; $('#ctabs').innerHTML = '';
    $('#shelf').innerHTML = `<div class="empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#e5383b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c3-1.5 6-1.5 10 1 4-2.5 7-2.5 10-1v14c-3-1.5-6-1.5-10 1-4-2.5-7-2.5-10-1z"/><path d="M12 6v14"/></svg>
      <h2>Nessun manga, ancora</h2>
      <p>Tocca <b>Aggiungi</b> e scegli un PDF, un CBZ/ZIP<br>oppure tutte le immagini JPG di un volume,<br>oppure collega il tuo repository GitHub.</p>
    </div>`;
    return;
  }
  // continua a leggere
  const cur = LIB.filter(i => i.lastRead && !i.read).sort((a, b) => b.lastRead - a.lastRead)[0];
  $('#continue').innerHTML = cur ? `<button class="cont" data-item="${cur.id}">
      <div class="th">${cur.cover ? `<img src="${cur.cover}" alt="">` : ICON_CLOUD}</div>
      <div class="ci"><div class="k">CONTINUA A LEGGERE</div><div class="t">${esc(cur.title)}</div>
      <div class="m">${cur.series ? esc(cur.series) + ' · ' : ''}${statusOf(cur)}</div><div class="pbar"><i style="width:${pct(cur)}%"></i></div></div>
    </button>` : '';
  // serie
  const groups = new Map();
  for (const n of (S.colls || [])) groups.set(n, []);
  for (const i of LIB) if (i.series) { if (!groups.has(i.series)) groups.set(i.series, []); groups.get(i.series).push(i); }
  renderTabs([...groups.keys()]);
  let series = [...groups.entries()];
  const agg = (list, f) => Math.max(0, ...list.map(f));
  if (S.sort === 'recent') series.sort((a, b) => agg(b[1], i => i.lastRead || 0) - agg(a[1], i => i.lastRead || 0) || natural(a[0], b[0]));
  else if (S.sort === 'added') series.sort((a, b) => agg(b[1], i => i.added || 0) - agg(a[1], i => i.added || 0) || natural(a[0], b[0]));
  else series.sort((a, b) => natural(a[0], b[0]));
  const singles = sortItems(LIB.filter(i => !i.series));
  const sortBtn = `<button class="sortbtn" data-sort>Ordina: <b>${SORTS[S.sort] || 'Nome'}</b> ▾</button>`;
  const seriesCard = ([name, list]) => {
    list.sort((a, b) => natural(sortKey(a), sortKey(b)));
    const cov = list.find(i => i.cover), nRead = list.filter(i => i.read).length;
    const allRead = list.length && nRead === list.length;
    return `<div class="book stack"><button class="cover" data-series="${esc(name)}" style="width:100%;display:block">
        ${cov ? `<img src="${cov.cover}" alt="">` : `<div class="ph">${esc(name)}</div>`}
        ${allRead ? '<span class="readb">✓ LETTO</span>' : ''}
      </button>
      <button class="more" style="top:14px;right:14px" data-cmore="${esc(name)}" aria-label="Opzioni">⋯</button>
      <div class="btitle">${esc(name)}</div>
      <div class="bmeta">${list.length ? `${list.length} ${list.length === 1 ? 'volume' : 'volumi'} · ${nRead} letti` : 'Vuota · tocca ⋯ per aggiungere'}</div></div>`;
  };
  const card = i => `<div class="book">
      <button class="cover" data-item="${i.id}" style="width:100%;display:block">
        ${i.cover ? `<img src="${i.cover}" alt="">` : `<div class="ph">${esc(i.title)}</div>`}
        ${i.read ? '<span class="readb">✓ LETTO</span>' : (!i.lastRead && i.state === 'local' ? '<span class="badge">NUOVO</span>' : '')}
        ${i.lastRead && !i.read ? `<div class="prog"><i style="width:${pct(i)}%"></i></div>` : ''}
        ${i.state !== 'local' ? `<span class="cloudb">${ICON_CLOUD}</span>` : ''}
      </button>
      <button class="more" data-more="${i.id}" aria-label="Opzioni">⋯</button>
      <div class="btitle">${esc(i.title)}</div>
      <div class="bmeta">${statusOf(i)}</div></div>`;
  $('#shelf').innerHTML =
    (series.length ? `<div class="sechead"><div class="section">Collezioni</div>${sortBtn}</div><div class="grid">${series.map(seriesCard).join('')}</div>` : '') +
    (singles.length ? `<div class="sechead" style="margin-top:${series.length ? 34 : 0}px"><div class="section">Volumi</div>${series.length ? '' : sortBtn}</div><div class="grid">${singles.map(card).join('')}</div>` : '');
}

function renderSeries() {
  const list = LIB.filter(i => i.series === libSeries).sort(byName);
  if (S.chOrder === 'desc') list.reverse();
  const known = list.length || (S.colls || []).includes(libSeries);
  if (!known) { libSeries = null; return renderLibrary(); }
  const nRead = list.filter(i => i.read).length;
  const freeable = list.filter(i => i.read && i.state === 'local' && i.path).length;
  const next = [...list].sort(byName).find(i => !i.read);
  $('#continue').innerHTML = '';
  $('#shelf').innerHTML = `<div class="shead"><button class="ibtn" data-up aria-label="Indietro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><div class="stitle" style="text-transform:uppercase">${esc(libSeries)}</div><div class="sub" style="margin-top:4px">${list.length} volumi · ${nRead} letti</div></div></div>
    <div class="sacts">
      <button class="pill red" data-addto="${esc(libSeries)}">+ Aggiungi volumi</button>
      <button class="pill" data-cmore="${esc(libSeries)}">⋯ Collezione</button>

$('#library').addEventListener('click', e => {
  const t = e.target;
  const more = t.closest('[data-more]'); if (more) return itemMenu(more.dataset.more);
  const cm0 = t.closest('[data-cmore]'); if (cm0) return collMenu(cm0.dataset.cmore);
  const it = t.closest('[data-item]'); if (it) return openItem(it.dataset.item);
  const se = t.closest('[data-series]');
  if (se) { libSeries = se.dataset.series; history.pushState({ series: libSeries }, ''); window.scrollTo(0, 0); return renderLibrary(); }
  if (t.closest('[data-up]')) return history.back();
  if (t.closest('[data-sort]')) return sortSheet();
  const cm = t.closest('[data-cmore]'); if (cm) return collMenu(cm.dataset.cmore);
  const at = t.closest('[data-addto]'); if (at) return addToColl(at.dataset.addto);

});

async function openItem(id) {
  const i = LIB.find(x => x.id === id);
  if (!i) return;
  if (i.state === 'local') return openBook(id);
  if (!GH.cfg) return toast('Collega GitHub per scaricarlo');
  return downloadRemote(i.path);
}

// il volume resta in libreria (copertina, segnalibro, letto) ma il file esce dal telefono
async function offload(book) {
  if (!book || !book.path || book.offloaded) return;
  await DB.tx('files', 'readwrite', st => st.delete(book.id));
  book.offloaded = true;
  await DB.put(book);
}
async function freeSpace(pred) {
  const list = LIB.filter(i => i.state === 'local' && i.path && pred(i));
  if (!list.length) return toast('Niente da togliere');
  const size = list.reduce((s, i) => s + i.size, 0);
  for (const i of list) await offload(i.book);
  toast(`Liberati ${fmtSize(size)} · restano su GitHub`);
  renderLibrary();
}
async function stubFor(i) { // record minimo per un volume mai scaricato su questo telefono
  if (i.book) return i.book;
  const b = { id: i.id, title: i.title, path: i.path, kind: null, pages: i.pages, page: i.page, added: Date.now(),
    lastRead: i.lastRead, cover: null, size: i.size, offloaded: true, read: i.read };
  await DB.put(b); return b;
}
async function setRead(i, val) {
  const b = await stubFor(i);
  b.read = val;
  b.page = val ? Math.max(0, (b.pages || 1) - 1) : 0;
  b.lastRead = Date.now();
  await DB.put(b);
  if (b.path) GH.pushSoon(0);
  if (val && S.autoFree !== 'off' && b.path && !b.offloaded) { await offload(b); toast('Segnato come letto e tolto dal telefono'); }
  else toast(val ? 'Segnato come letto' : 'Segnato come da leggere');
  renderLibrary();
}

function itemMenu(id) {
  const i = LIB.find(x => x.id === id); if (!i) return;
  const acts = [['open', i.state === 'local' ? 'Leggi' : 'Scarica e leggi']];
  acts.push(i.read ? ['unread', 'Segna come da leggere'] : ['read', 'Segna come letto']);
  if (i.book && i.lastRead) acts.push(['restart', 'Ricomincia dall\'inizio']);
  if (i.state !== 'local' && i.path) acts.push(['get', 'Scarica sul telefono']);
  if (i.state === 'local' && i.path) acts.push(['free', `Togli dal telefono (resta su GitHub)${i.size ? ' · ' + fmtSize(i.size) : ''}`]);
  acts.push(['series', i.series ? `Collezione: ${esc(i.series)} · sposta` : 'Metti in una collezione…']);
  if (i.book && !i.path) acts.push(['rename', 'Rinomina']);
  if (i.book && !i.path) acts.push(['del', 'Elimina dal telefono', 'danger']);
  openSheet(`<h3>${esc(i.title)}</h3><div class="menu">${acts.map(([a, l, c]) => `<button data-a="${a}" class="${c || ''}">${l}</button>`).join('')}</div>`);
  $('#sheet').querySelectorAll('[data-a]').forEach(btn => btn.onclick = async () => {
    const a = btn.dataset.a; closeSheet();
    if (a === 'open') openItem(id);
    if (a === 'read') setRead(i, true);
    if (a === 'unread') setRead(i, false);
    if (a === 'restart') { i.book.page = 0; i.book.read = false; i.book.lastRead = Date.now(); await DB.put(i.book); if (i.path) GH.pushSoon(0); openItem(id); }
    if (a === 'get') downloadRemote(i.path, false);
    if (a === 'free') { await offload(i.book); toast(`Tolto dal telefono · resta su GitHub`); renderLibrary(); }
    if (a === 'rename') setTimeout(() => renameSheet(i.book), 300);
    if (a === 'series') setTimeout(async () => seriesSheet(await stubFor(i)), 300);
    if (a === 'del') setTimeout(() => {
      openSheet(`<h3>Eliminare "${esc(i.title)}"?</h3><p style="color:var(--muted);font-size:14px;margin:-6px 0 18px">Viene tolto dal telefono.</p>
        <div class="row2"><button class="btn2" data-x>Annulla</button><button class="btn1" data-ok>Elimina</button></div>`);
      $('#sheet [data-x]').onclick = closeSheet;
      $('#sheet [data-ok]').onclick = async () => { closeSheet(); await DB.del(id); renderLibrary(); toast('Eliminato'); };
    }, 300);
  });
}

// all'import: se il nome somiglia a una serie esistente (o a un altro volume) li raggruppa
async function autoSeries(book) {
  const g = guessSeries(book.title); if (!g) return;
  const all = await libraryItems();
  const exist = [...new Set(all.map(i => i.series).filter(Boolean))].find(n => n.toLowerCase() === g.toLowerCase());
  if (exist) { book.series = exist; await DB.put(book); return; }
  const twins = all.filter(i => i.book && !i.path && !i.series && i.id !== book.id && (guessSeries(i.title) || '').toLowerCase() === g.toLowerCase());
  if (twins.length) {
    book.series = g; await DB.put(book);
    for (const t of twins) { t.book.series = g; await DB.put(t.book); }
  }
}

// una volta sola: raggruppa i volumi già caricati dal telefono con lo stesso nome di serie
async function groupExisting() {
  if (S.grouped) return;
  const all = await libraryItems(), m = new Map();
  for (const i of all) if (i.book && !i.path && !i.series) {
    const g = guessSeries(i.title); if (!g) continue;
    const k = g.toLowerCase(); if (!m.has(k)) m.set(k, { g, l: [] }); m.get(k).l.push(i);
  }
  for (const { g, l } of m.values()) if (l.length >= 2) for (const i of l) { i.book.series = g; await DB.put(i.book); }
  S.grouped = true; saveSettings();
}

/* ---------- formati: PDF, CBZ/ZIP, immagini ---------- */
const IMG_RE = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;
const isPdf = f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name);
const isZip = f => /\.(cbz|zip)$/i.test(f.name) || /zip|cbz/i.test(f.type);
const isImg = f => /^image\//.test(f.type) || IMG_RE.test(f.name);
const natural = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
const mimeOf = n => /\.png$/i.test(n) ? 'image/png' : /\.webp$/i.test(n) ? 'image/webp' : /\.gif$/i.test(n) ? 'image/gif' : /\.avif$/i.test(n) ? 'image/avif' : 'image/jpeg';
const cleanTitle = n => n.replace(/\.[a-z0-9]+$/i, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();

const FULL = { x: 0, y: 0, w: 1, h: 1 };

// trova i margini vuoti (bianchi o neri) attorno alla tavola
function detectCrop(c) {
  const W = c.width, H = c.height;
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const L = new Float32Array(W * H);
  for (let k = 0, j = 0; k < W * H; k++, j += 4) L[k] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000;
  const edge = [];
  for (let x = 0; x < W; x += 2) edge.push(L[x], L[(H - 1) * W + x]);
  for (let y = 0; y < H; y += 2) edge.push(L[y * W], L[y * W + W - 1]);
  edge.sort((a, b) => a - b);
  const bg = edge[edge.length >> 1];
  if (bg > 70 && bg < 185) return FULL; // sfondo non uniforme: non tocco niente
  const ink = k => Math.abs(L[k] - bg) > 50;
  const rowMin = Math.max(3, W * 0.012), colMin = Math.max(3, H * 0.012);
  const rowInk = y => { let n = 0; for (let x = 0; x < W; x++) if (ink(y * W + x)) n++; return n >= rowMin; };
  let top = 0; while (top < H && !rowInk(top)) top++;
  if (top >= H) return FULL;
  let bot = H - 1; while (bot > top && !rowInk(bot)) bot--;
  const colInk = x => { let n = 0; for (let y = top; y <= bot; y++) if (ink(y * W + x)) n++; return n >= colMin; };
  let left = 0; while (left < W && !colInk(left)) left++;
  let right = W - 1; while (right > left && !colInk(right)) right--;
  const pad = 0.012, maxc = 0.22;
  let x0 = Math.max(0, left / W - pad), y0 = Math.max(0, top / H - pad);
  let x1 = Math.min(1, (right + 1) / W + pad), y1 = Math.min(1, (bot + 1) / H + pad);
  x0 = Math.min(x0, maxc); y0 = Math.min(y0, maxc); x1 = Math.max(x1, 1 - maxc); y1 = Math.max(y1, 1 - maxc);
  if (x1 - x0 > 0.97 && y1 - y0 > 0.97) return FULL;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

async function openPdfDoc(buf) {
  const task = pdfjsLib.getDocument({ data: buf });
  const pdf = await task.promise;
  return {
    numPages: pdf.numPages,
    async ratios() {
      const ps = await Promise.all(Array.from({ length: pdf.numPages }, (_, i) => pdf.getPage(i + 1)));
      return ps.map(p => { const v = p.getViewport({ scale: 1 }); return v.width / v.height; });
    },
    async render(i, w, h, cr = FULL) {
      const page = await pdf.getPage(i + 1);
      const vp0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(w / (vp0.width * cr.w), h / (vp0.height * cr.h)) });
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(vp.width * cr.w)); c.height = Math.max(1, Math.round(vp.height * cr.h));
      await page.render({ canvas: c, viewport: vp, transform: [1, 0, 0, 1, -cr.x * vp.width, -cr.y * vp.height] }).promise;
      page.cleanup();
      return c;
    },
    destroy: () => task.destroy()
  };
}

function imageDoc(blobs) {
  return {
    numPages: blobs.length,
    async ratios() {
      const r = [];
      for (const b of blobs) {
        try { const bm = await createImageBitmap(b); r.push(bm.width / bm.height); bm.close(); }
        catch { r.push(0.7); }
      }
      return r;
    },
    async render(i, w, h, cr = FULL) {
      const bm = await createImageBitmap(blobs[i]);
      const sx = cr.x * bm.width, sy = cr.y * bm.height, sw = cr.w * bm.width, sh = cr.h * bm.height;
      const s = Math.min(w / sw, h / sh);
      const cw = Math.max(1, Math.round(sw * s)), ch = Math.max(1, Math.round(sh * s));
      let src = bm, rect = [sx, sy, sw, sh];
      if (s < 0.5) { // ridimensionamento di qualità per immagini molto grandi
        try {
          src = await createImageBitmap(blobs[i], Math.round(sx), Math.round(sy), Math.max(1, Math.round(sw)), Math.max(1, Math.round(sh)),
            { resizeWidth: cw, resizeHeight: ch, resizeQuality: 'high' });
          rect = [0, 0, src.width, src.height];
        } catch { src = bm; }
      }
      const c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, ...rect, 0, 0, cw, ch);
      bm.close(); if (src !== bm) src.close();
      return c;
    },
    destroy() {}
  };
}

function titleFromImages(files) {
  const dir = (files[0].webkitRelativePath || '').split('/').slice(-2, -1)[0];
  if (dir) return cleanTitle(dir);
  const names = files.map(f => f.name.replace(/\.[a-z0-9]+$/i, ''));
  let pre = names[0];
  for (const n of names) while (pre && !n.startsWith(pre)) pre = pre.slice(0, -1);
  pre = cleanTitle(pre.replace(/[\s_\-.(\[]*(p|pag|page|pagina)?[\s_\-.]*\d*$/i, ''));
  return pre.length >= 3 ? pre : 'Nuovo volume';
}

async function saveVolume({ title, kind, data, doc, size, id, extra }) {
  const ratios = await doc.ratios();
  const c = await doc.render(0, 360, 1200);
  const cover = c.toDataURL('image/jpeg', 0.78);
  id = id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const book = { id, title, kind, pages: doc.numPages, page: 0, added: Date.now(), lastRead: 0, cover, size, ratios, ...(extra || {}) };
  await DB.putFile(id, data);
  await DB.put(book);
  return book;
}

async function importFiles(files) {
  const pdfs = files.filter(isPdf), zips = files.filter(f => !isPdf(f) && isZip(f));
  const imgs = files.filter(f => !isPdf(f) && !isZip(f) && isImg(f)).sort((a, b) => natural(a.webkitRelativePath || a.name, b.webkitRelativePath || b.name));
  const jobs = [...pdfs.map(f => ['pdf', f]), ...zips.map(f => ['zip', f])];
  if (imgs.length) jobs.push(['imgs', imgs]);
  if (!jobs.length) return toast('Scegli un PDF, un CBZ/ZIP o delle immagini');
  let ok = 0, last = null, imgBook = null;
  for (let k = 0; k < jobs.length; k++) {
    const [type, f] = jobs[k];
    const name = type === 'imgs' ? `${f.length} immagini` : f.name;
    const step = jobs.length > 1 ? `(${k + 1}/${jobs.length}) ` : '';
    loading(`Importo ${step}${name}…`);
    try {
      if (type === 'pdf') {
        const buf = await f.arrayBuffer();
        const blob = new Blob([buf], { type: 'application/pdf' });
        const doc = await openPdfDoc(buf);
        last = await saveVolume({ title: cleanTitle(f.name), kind: 'pdf', data: blob, doc, size: f.size });
        await autoSeries(last);
        await doc.destroy();
      } else if (type === 'zip') {
        const u8 = new Uint8Array(await f.arrayBuffer());
        const entries = unzipSync(u8, { filter: e => IMG_RE.test(e.name) && !/(^|\/)(__MACOSX|\.)/.test(e.name) });
        const names = Object.keys(entries).sort(natural);
        if (!names.length) throw new Error('nessuna immagine nello zip');
        const blobs = names.map(n => new Blob([entries[n]], { type: mimeOf(n) }));
        last = await saveVolume({ title: cleanTitle(f.name), kind: 'images', data: { pages: blobs }, doc: imageDoc(blobs), size: f.size });
        await autoSeries(last);
      } else {
        const blobs = f.map(x => new Blob([x], { type: x.type || mimeOf(x.name) }));
        const size = f.reduce((s, x) => s + x.size, 0);
        last = imgBook = await saveVolume({ title: titleFromImages(f), kind: 'images', data: { pages: blobs }, doc: imageDoc(blobs), size });
      }
      ok++;
    } catch (err) {
      console.error(err);
      toast(`Non riesco ad aprire ${name}`);
    }
  }
  loading('');
  await renderLibrary();
  if (imgBook) renameSheet(imgBook, `Volume da ${imgBook.pages} immagini — come lo chiamo?`);
  else if (ok) toast(ok === 1 ? 'Aggiunto alla libreria' : `${ok} volumi aggiunti`);
}

/* ================= lettore ================= */
const stage = $('#stage'), zoomEl = $('#zoom'), under = $('#under'), flipper = $('#flipper');
const underCv = $('#underCv'), flipCv = $('#flipCv'), underShade = $('#underShade'), flipShade = $('#flipShade');

const R = {
  book: null, pdf: null, ratios: [], views: [], vi: 0, crops: new Map(), cropsDone: {},
  pageCache: new Map(), viewCache: new Map(), sizeKey: ''
};

function isDouble() {
  if (S.mode === 'single') return false;
  if (S.mode === 'double') return true;
  return stage.clientWidth > stage.clientHeight * 1.05;
}
function buildViews() {
  const n = R.pdf.numPages, r = R.ratios, v = [];
  if (!isDouble()) { for (let i = 0; i < n; i++) v.push([i]); }
  else {
    v.push([0]); // copertina da sola
    let i = 1;
    while (i < n) {
      if (r[i] > 1 || i + 1 >= n || r[i + 1] > 1) { v.push([i]); i++; }
      else { v.push([i, i + 1]); i += 2; }
    }
  }
  R.views = v;
}
const viewOf = p => Math.max(0, R.views.findIndex(v => v.includes(p)));
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
const bgColor = () => S.tone === 'night' ? '#ffffff' : S.bg === 'white' ? '#ffffff' : '#000000';

// singola pagina renderizzata alla dimensione esatta in pixel
function pageCanvas(i, w, h, cr = FULL) {
  const key = `${i}:${w}x${h}:${cr.x.toFixed(3)},${cr.y.toFixed(3)},${cr.w.toFixed(3)},${cr.h.toFixed(3)}`;
  if (R.pageCache.has(key)) { const p = R.pageCache.get(key); R.pageCache.delete(key); R.pageCache.set(key, p); return p; }
  const p = R.pdf.render(i, w, h, cr);
  p.catch(() => R.pageCache.delete(key));
  R.pageCache.set(key, p);
  while (R.pageCache.size > 6) R.pageCache.delete(R.pageCache.keys().next().value);
  return p;
}
function getCrop(i) {
  if (S.crop !== 'on') return Promise.resolve(FULL);
  if (R.crops.has(i)) return R.crops.get(i);
  const doc = R.pdf;
  const p = doc.render(i, 220, 330, FULL).then(detectCrop).catch(() => FULL);
  R.crops.set(i, p);
  p.then(c => { if (R.pdf === doc) R.cropsDone[i] = c; });
  return p;
}

// vista completa (1 o 2 pagine). In modalità "larghezza" può essere più alta dello schermo e si scorre
function composeView(vi, q = 1) {
  const W = stage.clientWidth, H = stage.clientHeight, d = dpr() * q;
  const key = `${vi}|${W}x${H}@${d}|${S.dir}|${S.bg}|${S.fit}|${S.crop}`;
  if (q === 1 && R.viewCache.has(key)) return R.viewCache.get(key);
  const pages = R.views[vi];
  const order = S.dir === 'rtl' ? [...pages].reverse() : pages; // ordine di disegno da sinistra
  const p = (async () => {
    let cr = await Promise.all(order.map(getCrop));
    if (cr.length === 2) { // stessa altezza per le due pagine affiancate
      const a = Math.min(cr[0].y, cr[1].y), b = Math.max(cr[0].y + cr[0].h, cr[1].y + cr[1].h);
      cr = cr.map(c => ({ ...c, y: a, h: b - a }));
    }
    const ratios = order.map((pi, k) => (R.ratios[pi] || 0.7) * cr[k].w / cr[k].h);
    const tot = ratios.reduce((a, b) => a + b, 0);
    let h = H, w = h * tot;
    if (w > W) { w = W; h = w / tot; }
    else if (S.fit === 'width' && W / tot > H * 1.1) { w = W; h = W / tot; }
    const CH = Math.max(H, h);
    const x0 = (W - w) / 2, y0 = (CH - h) / 2;
    const pcs = await Promise.all(order.map((pi, k) =>
      pageCanvas(pi, Math.round(h * ratios[k] * d), Math.round(h * d), cr[k])));
    const c = document.createElement('canvas');
    c.width = Math.round(W * d); c.height = Math.round(CH * d); c.cssH = CH;
    c.fitGain = (W / tot) / H; // quanto si ingrandisce passando alla larghezza
    const ctx = c.getContext('2d');
    ctx.fillStyle = bgColor(); ctx.fillRect(0, 0, c.width, c.height);
    ctx.imageSmoothingQuality = 'high';
    let x = x0;
    order.forEach((pi, k) => {
      const pw = h * ratios[k];
      ctx.drawImage(pcs[k], x * d, y0 * d, pw * d, h * d);
      x += pw;
    });
    if (order.length === 2) { // ombra della rilegatura al centro
      const cx = (x0 + h * ratios[0]) * d, gw = 26 * d;
      const g = ctx.createLinearGradient(cx - gw, 0, cx + gw, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,.28)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(cx - gw, y0 * d, gw * 2, h * d);
    }
    return c;
  })();
  if (q === 1) {
    p.catch(() => R.viewCache.delete(key));
    R.viewCache.set(key, p);
    p.then(c => { p.canvas = c; });
    while (R.viewCache.size > 5) R.viewCache.delete(R.viewCache.keys().next().value);
  }
  return p;
}

let drawTok = 0;
// scorrimento verticale di un livello (modalità larghezza)
const maxScroll = cv => Math.max(0, (cv.cssH || 0) - stage.clientHeight);
function setScroll(cv, y) {
  cv.sy = clamp(y, 0, maxScroll(cv));
  cv.style.transform = cv.sy ? `translate3d(0,${-cv.sy}px,0)` : '';
}
function blit(dst, src, sy) {
  dst.tok = ++drawTok;
  if (dst.width !== src.width || dst.height !== src.height) { dst.width = src.width; dst.height = src.height; }
  dst.getContext('2d').drawImage(src, 0, 0);
  dst.cssH = src.cssH || stage.clientHeight;
  dst.fitGain = src.fitGain || 1;
  dst.style.height = dst.cssH + 'px';
  dst.style.transition = '';
  setScroll(dst, sy ?? (src.sy || 0));
}
// pos: 'top' | 'bottom' | 'keep'
async function show(dst, vi, q = 1, pos = 'keep') {
  const tok = dst.tok = ++drawTok;
  const p = composeView(vi, q);
  const y = () => pos === 'top' ? 0 : pos === 'bottom' ? 1e9 : (dst.sy || 0);
  if (p.canvas) return blit(dst, p.canvas, y());
  try { const c = await p; if (dst.tok === tok) blit(dst, c, y()); } catch (e) { console.error(e); }
}
let inT;
function animScroll(cv, y) {
  cancelAnimationFrame(inT);
  cv.style.transition = 'transform .32s cubic-bezier(.25,.8,.3,1)';
  setScroll(cv, y);
  clearTimeout(cv._tt); cv._tt = setTimeout(() => { cv.style.transition = ''; }, 340);
}
function inertia(v) {
  cancelAnimationFrame(inT);
  let last = performance.now();
  const stepF = t => {
    const dt = t - last; last = t;
    v *= Math.pow(0.996, dt);
    if (Math.abs(v) < 0.03) return;
    const before = underCv.sy;
    setScroll(underCv, underCv.sy - v * dt);
    if (underCv.sy !== before) inT = requestAnimationFrame(stepF);
  };
  inT = requestAnimationFrame(stepF);
}
let pfT;
function prefetch() { // prepara le pagine vicine a dito fermo, così l'animazione non scatta
  clearTimeout(pfT);
  pfT = setTimeout(() => {
    if (!R.pdf) return;
    for (const k of [1, -1, 2]) { const v = R.vi + k; if (v >= 0 && v < R.views.length) composeView(v); }
  }, 140);
}

async function openBook(id) {
  const book = await DB.get(id);
  if (!book) return;
  loading('Apro il volume…');
  try {
    const data = await DB.file(id);
    const pdf = book.kind === 'images' ? imageDoc(data.pages) : await openPdfDoc(await data.arrayBuffer());
    R.book = book; R.pdf = pdf;
    R.pageCache.clear(); R.viewCache.clear();
    R.cropsDone = { ...(book.crops || {}) };
    R.crops = new Map(Object.entries(R.cropsDone).map(([k, v]) => [+k, Promise.resolve(v)]));
    if (book.ratios && book.ratios.length === pdf.numPages) R.ratios = book.ratios;
    else { R.ratios = await pdf.ratios(); book.ratios = R.ratios; }
    book.pages = pdf.numPages;
    book.lastRead = Date.now();
    DB.put(book);
    $('#rtitle').textContent = book.title;
    if (!$('#reader').classList.contains('on')) history.pushState({ reader: true }, '');
    $('#reader').classList.add('on');
    applyLook();
    resetZoom(false);
    buildViews();
    R.vi = viewOf(clamp(book.page || 0, 0, pdf.numPages - 1));
    R.sizeKey = stage.clientWidth + 'x' + stage.clientHeight;
    await show(underCv, R.vi, 1, 'top');
    loading('');
    updateUI();
    prefetch();
    keepAwake();
    if (!S.hintSeen) showHint(); else flashUI();
  } catch (e) {
    console.error(e); loading(''); toast('Errore nell\'apertura del volume'); leaveBrokenReader();
  }
}

async function closeReader(fromPop) {
  if (!R.pdf) return;
  finishNow();
  if (R.book) R.book.crops = R.cropsDone;
  saveProgress(true);
  $('#reader').classList.remove('on', 'ui');
  const doc = R.pdf, book = R.book; R.pdf = null;
  R.pageCache.clear(); R.viewCache.clear();
  underCv.width = underCv.height = flipCv.width = flipCv.height = 1;
  releaseAwake();
  try { await doc.destroy(); } catch {}
  await autoFree(book);
  if (!fromPop && history.state && history.state.reader) history.back();
  renderLibrary();
}
window.addEventListener('popstate', e => {
  if ($('#reader').classList.contains('on')) return closeReader(true);
  const sr = (e.state && e.state.series) || null;
  if (sr !== libSeries) { libSeries = sr; window.scrollTo(0, 0); renderLibrary(); }
});
async function autoFree(book) {
  if (book && book.read && book.path && !book.offloaded && S.autoFree !== 'off') {
    await offload(book); toast('Volume letto tolto dal telefono · resta su GitHub');
  }
}
function leaveBrokenReader() {
  if ($('#reader').classList.contains('on') && !R.pdf) {
    $('#reader').classList.remove('on', 'ui');
    if (history.state && history.state.reader) history.back();
    renderLibrary();
  }
}
// capitolo successivo della stessa serie
function nextChapter() {
  if (!R.book) return null;
  const sr = collOf(R.book); if (!sr) return null;
  const list = LIB.filter(i => i.series === sr).sort(byName);
  const k = list.findIndex(i => i.id === R.book.id);
  return k >= 0 ? list[k + 1] || null : null;
}
async function goNext(item) {
  finishNow();
  if (R.book) R.book.crops = R.cropsDone;
  saveProgress(true);
  const doc = R.pdf, book = R.book; R.pdf = null;
  R.pageCache.clear(); R.viewCache.clear();
  try { await doc.destroy(); } catch {}
  await autoFree(book);
  LIB = await libraryItems();
  const it = LIB.find(x => x.id === item.id) || item;
  if (it.state === 'local') await openBook(it.id); else await downloadRemote(it.path);
}
$('#backBtn').onclick = () => closeReader(false);

let saveT;
function saveProgress(now) {
  if (!R.book) return;
  R.book.page = Math.min(...R.views[R.vi]);
  if (R.vi === R.views.length - 1) {
    R.book.page = R.pdf ? R.pdf.numPages - 1 : R.book.page;
    if (!R.book.read) { R.book.read = true; toast('Volume finito ✓ segnato come letto'); }
  }
  R.book.lastRead = Date.now();
  clearTimeout(saveT);
  const b = { ...R.book };
  if (now) DB.put(b).then(() => b.path && GH.pushSoon(now ? 0 : 4000));
  else saveT = setTimeout(() => DB.put(b).then(() => b.path && GH.pushSoon(4000)), 400);
}

const TONES = { normal: '', warm: 'sepia(.38) saturate(1.15) brightness(.93)', night: 'invert(.88) hue-rotate(180deg) contrast(.95)' };
function applyTone() {
  zoomEl.style.filter = TONES[S.tone] || '';
  $('#dim').style.opacity = S.dim || 0;
}
function applyLook() {
  applyTone();
  $('#reader').style.background = S.tone === 'night' ? '#121212' : bgColor();
  $('#slider').style.direction = S.dir === 'rtl' ? 'rtl' : 'ltr';
  const W = stage.clientWidth, H = stage.clientHeight;
  zoomEl.style.perspective = Math.round(Math.max(W, H) * 2.2) + 'px';
}

function updateUI() {
  const v = R.views[R.vi], n = R.pdf.numPages;
  const lbl = v.length === 2 ? `${Math.min(...v) + 1}–${Math.max(...v) + 1}` : `${v[0] + 1}`;
  const L = `<b>Pagina ${lbl}</b> di ${n}`, Rr = `${Math.round((Math.max(...v) + 1) / n * 100)}%`;
  if (S.dir === 'rtl') { $('#pgL').innerHTML = Rr; $('#pgR').innerHTML = L; }
  else { $('#pgL').innerHTML = L; $('#pgR').innerHTML = Rr; }
  const sl = $('#slider'); sl.max = R.views.length - 1; sl.value = R.vi;
}
$('#slider').addEventListener('input', e => {
  const v = R.views[+e.target.value], n = R.pdf.numPages;
  const lbl = v.length === 2 ? `${Math.min(...v) + 1}–${Math.max(...v) + 1}` : `${v[0] + 1}`;
  $(S.dir === 'rtl' ? '#pgR' : '#pgL').innerHTML = `<b>Pagina ${lbl}</b> di ${n}`;
});
$('#slider').addEventListener('change', e => jumpTo(+e.target.value));
function jumpTo(vi) {
  finishNow(); resetZoom(false);
  R.vi = clamp(vi, 0, R.views.length - 1);
  show(underCv, R.vi, 1, 'top'); updateUI(); prefetch(); saveProgress();
}

/* ---------- UI visibile / nascosta ---------- */
function toggleUI(force) { $('#reader').classList.toggle('ui', force ?? !$('#reader').classList.contains('ui')); }
let flashT;
function flashUI() { toggleUI(true); clearTimeout(flashT); flashT = setTimeout(() => toggleUI(false), 1800); }

function showHint() {
  const rtl = S.dir === 'rtl';
  const h = $('#hint');
  h.innerHTML = rtl
    ? `<div class="go">◀ Avanti<small>tocca qui o trascina verso destra</small></div><div>Comandi<small>tocco al centro<br>pinch o doppio tocco = adatta / zoom</small></div><div>Indietro ▶<small>tocca qui</small></div>`
    : `<div>◀ Indietro<small>tocca qui</small></div><div>Comandi<small>tocco al centro<br>pinch o doppio tocco = adatta / zoom</small></div><div class="go">Avanti ▶<small>tocca qui o trascina verso sinistra</small></div>`;
  h.classList.add('on');
  h.onclick = () => { h.classList.remove('on'); S.hintSeen = true; saveSettings(); };
}

let endT;
function endcap(txt, side) {
  const el = $('#endcap'); el.textContent = txt;
  el.style.left = side === 'left' ? '16px' : 'auto'; el.style.right = side === 'right' ? '16px' : 'auto';
  el.classList.add('show'); clearTimeout(endT); endT = setTimeout(() => el.classList.remove('show'), 1200);
}

/* ================= sfogliare ================= */
// F = sfogliata in corso. p = avanzamento 0..1 (1 = pagina girata)
let F = null;

function startFlip(forward) {
  const target = R.vi + (forward ? 1 : -1);
  if (target < 0 || target >= R.views.length) {
    const fwdSide = S.dir === 'rtl' ? 'left' : 'right';
    const side = forward ? fwdSide : (fwdSide === 'left' ? 'right' : 'left');
    const nx = forward && nextChapter();
    if (nx) {
      openSheet(`<h3>Fine di ${esc(R.book.title)}</h3><p class="note">Prossimo capitolo: <b style="color:var(--text)">${esc(nx.title)}</b>${nx.state !== 'local' ? ' (si scarica da GitHub)' : ''}</p>
        <div class="row2"><button class="btn2" data-x>Resta qui</button><button class="btn1" data-ok>Leggi ›</button></div>`);
      $('#sheet [data-x]').onclick = closeSheet;
      $('#sheet [data-ok]').onclick = () => { closeSheet(); goNext(nx); };
    } else endcap(forward ? 'Fine del volume' : 'Sei alla prima pagina', side);
    return null;
  }
  const effect = isDouble() ? 'slide' : S.effect;
  F = { forward, target, p: 0, effect, anim: null };
  flipper.style.transition = 'none'; flipShade.style.transition = 'none'; underShade.style.transition = 'none';
  cancelAnimationFrame(inT);
  if (forward) { blit(flipCv, underCv); show(underCv, target, 1, 'top'); }
  else { show(flipCv, target, 1, 'bottom'); }
  flipper.style.transformOrigin = S.dir === 'rtl' ? '100% 50%' : '0% 50%';
  const shadeDir = S.dir === 'rtl' ? 'to left' : 'to right';
  flipShade.style.background = `linear-gradient(${shadeDir}, rgba(0,0,0,.05), rgba(0,0,0,.55))`;
  underShade.style.background = `linear-gradient(${shadeDir}, rgba(0,0,0,.45), rgba(0,0,0,0) 70%)`;
  flipper.style.display = 'block';
  setFlip(0);
  return F;
}

function setFlip(p) {
  F.p = p;
  const vis = F.forward ? p : 1 - p;        // quanto è "sollevata" la pagina superiore
  const s = S.dir === 'rtl' ? 1 : -1;
  const W = stage.clientWidth;
  if (F.effect === 'flip') {
    const ang = vis * 90;
    flipper.style.transform = `rotateY(${s * ang}deg)`;
    flipShade.style.opacity = (vis * 0.9).toFixed(3);
    underShade.style.opacity = (Math.sin(vis * Math.PI) * 0.9).toFixed(3);
  } else {
    flipper.style.transform = `translate3d(${s * vis * W}px,0,0)`;
    flipShade.style.opacity = (vis * 0.35).toFixed(3);
    underShade.style.opacity = ((1 - vis) * 0.6 * (vis > 0 ? 1 : 0)).toFixed(3);
  }
}

function endFlip(complete, ms) {
  if (!F) return;
  const f = F;
  ms = ms ?? Math.round(120 + 230 * (complete ? 1 - f.p : f.p));
  const tr = `transform ${ms}ms cubic-bezier(.25,.8,.3,1), opacity ${ms}ms`;
  flipper.style.transition = tr; flipShade.style.transition = `opacity ${ms}ms`; underShade.style.transition = `opacity ${ms}ms`;
  requestAnimationFrame(() => setFlip(complete ? 1 : 0));
  f.done = () => {
    if (F !== f) return;
    clearTimeout(f.anim);
    if (complete) {
      if (!f.forward) blit(underCv, flipCv);
      R.vi = f.target;
    } else if (f.forward) blit(underCv, flipCv);
    flipper.style.display = 'none'; flipper.style.transition = 'none';
    underShade.style.opacity = 0;
    F = null;
    if (complete) { updateUI(); prefetch(); saveProgress(); }
  };
  f.anim = setTimeout(f.done, ms + 30);
}
function finishNow() { if (F && F.done) F.done(); else if (F) { endFlip(false, 0); F && F.done && F.done(); } }

// avanti/indietro: se la pagina è più alta dello schermo prima scorre, poi gira
function step(forward) {
  const m = maxScroll(underCv), y = underCv.sy || 0, H = stage.clientHeight;
  if (Z.s <= 1.01 && m > 0 && !F) {
    if (forward && y < m - 2) return animScroll(underCv, y + H * 0.85);
    if (!forward && y > 2) return animScroll(underCv, y - H * 0.85);
  }
  turn(forward);
}
function turn(forward) {
  if (Z.s > 1.01) { resetZoom(true); }
  finishNow();
  if (startFlip(forward)) endFlip(true, 330);
}

/* ================= zoom ================= */
const Z = { s: 1, x: 0, y: 0 };
function applyZoom(anim) {
  zoomEl.classList.toggle('anim', !!anim);
  zoomEl.style.transform = Z.s === 1 && Z.x === 0 && Z.y === 0 ? '' : `translate3d(${Z.x}px,${Z.y}px,0) scale(${Z.s})`;
}
function clampZoom() {
  const W = stage.clientWidth, H = stage.clientHeight;
  Z.s = clamp(Z.s, 1, 5);
  Z.x = clamp(Z.x, W - W * Z.s, 0); Z.y = clamp(Z.y, H - H * Z.s, 0);
}
let hiresT;
function zoomSettled() {
  clearTimeout(hiresT);
  hiresT = setTimeout(() => {
    if (!R.pdf) return;
    if (Z.s > 1.2) {
      const W = stage.clientWidth, H = stage.clientHeight, d = dpr();
      const q = Math.min(Z.s, Math.sqrt(16e6 / (W * H * d * d)));
      if (q > 1.1) show(underCv, R.vi, q);
    }
  }, 180);
}
function resetZoom(anim) {
  if (Z.s === 1 && Z.x === 0 && Z.y === 0) return;
  Z.s = 1; Z.x = 0; Z.y = 0; applyZoom(anim);
  if (R.pdf) show(underCv, R.vi);
}
function zoomAt(px, py, s, anim) {
  const cx = (px - Z.x) / Z.s, cy = (py - Z.y) / Z.s;
  Z.s = s; Z.x = px - cx * s; Z.y = py - cy * s;
  clampZoom(); applyZoom(anim); zoomSettled();
}

/* ================= gesti ================= */
const P = new Map();
let G = null;            // gesto corrente
let lastTap = null, tapT = null;

stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  P.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (P.size === 2) {
    if (G && G.type === 'flip' && F) endFlip(false);
    const [a, b] = [...P.values()];
    G = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), s0: Z.s, x0: Z.x, y0: Z.y,
      m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
    zoomEl.classList.remove('anim');
    return;
  }
  if (P.size > 2) return;
  if (F) finishNow();
  cancelAnimationFrame(inT);
  G = { type: 'pending', sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), hist: [] };
});

stage.addEventListener('pointermove', e => {
  if (!P.has(e.pointerId)) return;
  P.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!G) return;
  if (G.type === 'pinch' && P.size >= 2) {
    const [a, b] = [...P.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const s = clamp(G.s0 * d / G.d0, 0.6, 5);
    const cx = (G.m0.x - G.x0) / G.s0, cy = (G.m0.y - G.y0) / G.s0;
    Z.s = s; Z.x = m.x - cx * s; Z.y = m.y - cy * s;
    if (s >= 1) clampZoom();
    applyZoom(false);
    return;
  }
  const dx = e.clientX - G.sx, dy = e.clientY - G.sy;
  if (G.type === 'pending') {
    if (Math.hypot(dx, dy) < 9) return;
    if (Z.s > 1.01) { G.type = 'pan'; G.px = Z.x; G.py = Z.y; zoomEl.classList.remove('anim'); }
    else if (Math.abs(dx) > Math.abs(dy) * 0.8) {
      const forward = S.dir === 'rtl' ? dx > 0 : dx < 0;
      G.type = startFlip(forward) ? 'flip' : 'none';
    } else if (dy > 0 && (underCv.sy || 0) <= 0) {
      G.type = 'dismiss'; $('#reader').classList.remove('ui');
    } else if (maxScroll(underCv) > 0) {
      G.type = 'scroll'; G.sy0 = underCv.sy || 0; underCv.style.transition = '';
    } else G.type = 'none';
  }
  if (G.type === 'dismiss') {
    const d = Math.max(0, dy);
    stage.style.transform = `translate3d(0,${d * 0.8}px,0) scale(${1 - Math.min(d, 700) / 2600})`;
    $('#reader').style.background = `rgba(0,0,0,${Math.max(0, 1 - d / 420).toFixed(3)})`;
    G.hist.push({ y: e.clientY, t: performance.now() });
    if (G.hist.length > 6) G.hist.shift();
    return;
  }
  if (G.type === 'scroll') {
    setScroll(underCv, G.sy0 - dy);
    G.hist.push({ y: e.clientY, t: performance.now() });
    if (G.hist.length > 6) G.hist.shift();
    return;
  }
  if (G.type === 'pan') {
    Z.x = G.px + dx; Z.y = G.py + dy; clampZoom(); applyZoom(false);
  } else if (G.type === 'flip' && F) {
    const sign = (S.dir === 'rtl' ? 1 : -1) * (F.forward ? 1 : -1);
    const W = stage.clientWidth;
    setFlip(clamp(sign * dx / (W * (F.effect === 'flip' ? 0.75 : 1)), 0, 1));
    G.hist.push({ x: e.clientX, t: performance.now() });
    if (G.hist.length > 6) G.hist.shift();
  }
});

function pointerEnd(e) {
  if (!P.has(e.pointerId)) return;
  P.delete(e.pointerId);
  if (!G) return;
  if (G.type === 'pinch') {
    // il pinch finisce appena si alza il primo dito: qui si decide l'adattamento
    const gain = underCv.fitGain || 1;
    if (S.fit === 'page' && Z.s > 1.12 && gain > 1.1) switchFit('width', G.m0.y);
    else if (S.fit === 'width' && Z.s < 0.9 && (underCv.cssH || 0) > stage.clientHeight + 1) switchFit('page');
    else if (Z.s < 1.08) resetZoom(true);
    else { clampZoom(); applyZoom(true); zoomSettled(); }
    if (P.size >= 1) { // il dito rimasto sposta la pagina solo se resta ingrandita
      const [p0] = [...P.values()];
      G = { type: Z.s > 1.01 ? 'pan' : 'none', sx: p0.x, sy: p0.y, px: Z.x, py: Z.y, hist: [] };
    } else G = null;
    return;
  }
  if (P.size > 0) return;
  if (G.type === 'flip' && F) {
    const h = G.hist; let v = 0;
    if (h.length >= 2) { const a = h[0], b = h[h.length - 1]; v = (b.x - a.x) / Math.max(1, b.t - a.t); }
    const sign = (S.dir === 'rtl' ? 1 : -1) * (F.forward ? 1 : -1);
    const fast = sign * v > 0.35, back = sign * v < -0.25;
    endFlip(!back && (F.p > 0.33 || (fast && F.p > 0.03)));
  } else if (G.type === 'dismiss') {
    const h = G.hist, d = e.clientY - G.sy;
    let v = 0; if (h.length >= 2) { const a = h[0], b = h[h.length - 1]; v = (b.y - a.y) / Math.max(1, b.t - a.t); }
    const rd = $('#reader');
    rd.classList.add('reader-dismiss');
    if (d > 120 || (v > 0.6 && d > 30)) {
      stage.style.transform = `translate3d(0,${stage.clientHeight}px,0) scale(.9)`; stage.style.opacity = 0;
      rd.style.background = 'rgba(0,0,0,0)';
      setTimeout(() => { closeReader(false); rd.classList.remove('reader-dismiss'); stage.style.transform = ''; stage.style.opacity = ''; }, 220);
    } else {
      stage.style.transform = ''; applyLook();
      setTimeout(() => rd.classList.remove('reader-dismiss'), 240);
    }
  } else if (G.type === 'scroll') {
    const h = G.hist;
    if (h.length >= 2) { const a = h[0], b = h[h.length - 1]; if (performance.now() - b.t < 80) inertia((b.y - a.y) / Math.max(1, b.t - a.t)); }
  } else if (G.type === 'pan') {
    zoomSettled();
  } else if (G.type === 'pending' && e.type === 'pointerup' && performance.now() - G.t < 450) {
    handleTap(e.clientX, e.clientY);
  }
  G = null;
}
stage.addEventListener('pointerup', pointerEnd);
stage.addEventListener('pointercancel', pointerEnd);

function handleTap(x, y) {
  const W = stage.clientWidth;
  const zone = x < W * 0.3 ? 'left' : x > W * 0.7 ? 'right' : 'center';
  const now = performance.now();
  const isDbl = lastTap && now - lastTap.t < 300 && Math.hypot(x - lastTap.x, y - lastTap.y) < 40;
  if (isDbl) {
    clearTimeout(tapT); lastTap = null;
    if (Z.s > 1.01) resetZoom(true);
    else if (S.fit === 'page' && (underCv.fitGain || 1) > 1.1) switchFit('width', y);
    else zoomAt(x, y, 2.5, true);
    return;
  }
  lastTap = { t: now, x, y };
  if ($('#reader').classList.contains('ui') && zone !== 'center') { clearTimeout(tapT); toggleUI(false); return; }
  // con lo zoom attivo o al centro aspettiamo un eventuale doppio tocco
  if (zone === 'center' || Z.s > 1.01) {
    clearTimeout(tapT);
    tapT = setTimeout(() => { lastTap = null; toggleUI(); }, 230);
    return;
  }
  const fwdZone = S.dir === 'rtl' ? 'left' : 'right';
  step(zone === fwdZone);
}

document.addEventListener('keydown', e => {
  if (!R.pdf || $('#sheet').classList.contains('on')) return;
  const rtl = S.dir === 'rtl';
  if (e.key === 'ArrowLeft') step(rtl);
  else if (e.key === 'ArrowRight') step(!rtl);
  else if (e.key === 'ArrowDown') animScroll(underCv, (underCv.sy || 0) + 120);
  else if (e.key === 'ArrowUp') animScroll(underCv, (underCv.sy || 0) - 120);
  else if (e.key === ' ' ) { e.preventDefault(); step(true); }
  else if (e.key === 'Escape') closeReader(false);
});
